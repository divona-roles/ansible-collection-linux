---
- name: YUM | Install EPEL Repository
  ansible.builtin.yum:
    name: "{{ packages }}"
    state: present
  vars:
    packages:
      - epel-release

- name: YUM | Enable Nux-Desktop repository
  ansible.builtin.yum_repository:
    name: nux-dextop
    description: Nux.Ro RPMs for general desktop use
    baseurl: "{{ nux_url }}"
    gpgkey: http://li.nux.ro/download/nux/RPM-GPG-KEY-nux.ro
    gpgcheck: true
    skip_if_unavailable: true

- name: YUM | Enable Repoforge repository
  ansible.builtin.yum_repository:
    name: rpmforge
    description: RPMforge YUM repo
    file: external_repos
    baseurl: "http://apt.sw.be/redhat/el{{ ansible_distribution_major_version }}/en/$basearch/rpmforge"
    mirrorlist: "http://mirrorlist.repoforge.org/el{{ ansible_distribution_major_version }}/mirrors-rpmforge"
    enabled: true

- name: Packages | Install shell tools
  ansible.builtin.yum:
    name: "{{ packages }}"
    state: present
  vars:
    packages:
      - which
      - tmux
      - tree
      - ncdu

- name: Packages | Install default packages
  ansible.builtin.yum:
    name: "{{ packages }}"
    state: present
  vars:
    packages:
      - ngrep
      - git
      - gnupg2
      - tig
      - unzip
      - rsyslog

- name: Packages | Install terminal emulators
  ansible.builtin.yum:
    name: "{{ packages }}"
    state: present
  vars:
    packages:
      - terminator

- name: Packages | Install network tools
  ansible.builtin.yum:
    name: "{{ packages }}"
    state: present
  vars:
    packages:
      - openssh
      - wget
      - curl
      - net-tools
      - mtr
      - traceroute
      - nmap
      - ngrep
      - nethogs
